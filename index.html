<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your photos</title>
<style>
  /* ---- Change these to match your brand ---- */
  :root {
    --bg: #f4f1ea;
    --ink: #161616;
    --accent: #ffc83d;
    --muted: #7a756b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 30px; letter-spacing: .06em; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .dash { border: 0; border-top: 2px dashed var(--ink); opacity: .35; margin: 18px 0; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 12px; margin: 0 0 18px; }
  .card img { display: block; width: 100%; height: auto; border-radius: 3px; background: #eee; min-height: 120px; }
  .card.receipt img { max-width: 360px; margin: 0 auto; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  a.btn, button.btn { display: inline-block; text-decoration: none; border: 0; cursor: pointer;
    background: var(--ink); color: #fff; font: inherit; font-size: 15px; font-weight: 700;
    padding: 10px 16px; border-radius: 4px; }
  .btn.big { display: block; width: 100%; text-align: center; background: var(--accent); color: var(--ink);
    font-size: 18px; padding: 15px; margin: 6px 0 22px; }
  .wait { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
  .tip { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .err { text-align: center; padding: 60px 10px; }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>SNAPLAB</h1>
    <div class="sub">Thanks for stopping by the booth!</div>
  </header>
</main>

<script>
(function () {
  var app = document.getElementById('app');
  var q = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  var cloud = q.c, prefix = q.p, count = parseInt(q.n || '0', 10) || 0;

  if (!cloud || !prefix || !/^[\w-]+$/.test(cloud) || !/^[\w\-\/]+$/.test(prefix)) {
    app.insertAdjacentHTML('beforeend', '<div class="err">This link looks incomplete.<br>Please scan the QR code again.</div>');
    return;
  }

  var base = 'https://res.cloudinary.com/' + cloud + '/image/upload/';
  function view(file) { return base + 'w_1200,c_limit,q_auto/' + prefix + '/' + file; }
  function download(file) { return base + 'fl_attachment/' + prefix + '/' + file; }

  var items = [{ file: 'receipt.png', name: 'Receipt', receipt: true }];
  for (var i = 1; i <= Math.min(count, 10); i++) {
    var f = 'photo_' + (i < 10 ? '0' + i : i) + '.jpg';
    items.push({ file: f, name: 'Photo ' + i });
  }

  if (items.length > 1) {
    app.insertAdjacentHTML('beforeend', '<button class="btn big" id="all">⬇ Download all (' + items.length + ')</button>');
  }

  items.forEach(function (it) {
    var card = document.createElement('div');
    card.className = 'card' + (it.receipt ? ' receipt' : '');
    card.innerHTML =
      '<img alt="' + it.name + '">' +
      '<div class="wait">Uploading from the booth… this fills in by itself.</div>' +
      '<div class="row"><span class="label">' + it.name + '</span>' +
      '<a class="btn" href="' + download(it.file) + '">⬇ Save</a></div>';
    var img = card.querySelector('img'), wait = card.querySelector('.wait');
    img.style.display = 'none';
    var tries = 0;
    img.onload = function () { img.style.display = 'block'; wait.style.display = 'none'; };
    img.onerror = function () {
      // Not uploaded yet (or no signal at the booth) - try again for a few minutes.
      if (++tries < 60) setTimeout(function () { img.src = view(it.file) + '?r=' + tries; }, 5000);
      else wait.textContent = 'Not available yet - please try this link again later.';
    };
    img.src = view(it.file);
    app.appendChild(card);
  });

  var all = document.getElementById('all');
  if (all) all.onclick = function () {
    items.forEach(function (it, k) {
      setTimeout(function () {
        var a = document.createElement('a');
        a.href = download(it.file);
        a.download = '';
        document.body.appendChild(a); a.click(); a.remove();
      }, k * 900);
    });
  };

  app.insertAdjacentHTML('beforeend',
    '<hr class="dash"><p class="tip">On iPhone, if a download doesn\'t start,<br>press and hold a photo and choose “Save to Photos”.</p>');
})();
</script>
</body>
</html>
